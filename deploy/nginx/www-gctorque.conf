# Nginx — config para www.gctorque.com (Landing Page TechOps + Taller)
#
# Este archivo sirve la landing page de marketing (Page_TechOps) desde
# www.gctorque.com, separada del sistema ERP del taller que corre en
# gctorque.com y subdominios (*.gctorque.com).
#
# Instalación:
#   1. Copiar a /etc/nginx/sites-available/www-gctorque.conf
#   2. Enlazar: sudo ln -s /etc/nginx/sites-available/www-gctorque.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANTE: Antes de activar, debes obtener el certificado SSL para
# www.gctorque.com. Si tu wildcard cert (*.gctorque.com) ya lo cubre,
# puedes usar los mismos paths de certificado. Si no, ejecuta:
#   sudo certbot certonly --nginx -d www.gctorque.com

# ============================================================
# HTTP → HTTPS redirect para www.gctorque.com
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name www.gctorque.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.gctorque.com$request_uri;
    }
}

# ============================================================
# HTTPS — www.gctorque.com (Landing Page)
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gctorque.com;

    # SSL — usa el mismo wildcard cert si cubre www, o uno específico
    ssl_certificate     /etc/letsencrypt/live/gctorque.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gctorque.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;
    # OCSP stapling deshabilitado — el cert wildcard no incluye OCSP responder URL
    # ssl_stapling on;
    # ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Logs
    access_log /var/log/nginx/www-gctorque-access.log;
    error_log  /var/log/nginx/www-gctorque-error.log warn;

    # Bloquear archivos sensibles
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ \.(env|sqlite3|db|log|config|ini|yml|yaml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # SPA — React Router (Page_TechOps build)
    # ============================================================
    location / {
        root /srv/page-techops/dist;
        try_files $uri $uri/ /index.html;

        # Cache agresivo para assets versionados (Vite agrega hash)
        location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
